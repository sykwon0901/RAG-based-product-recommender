[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-skincare-graphrag"
version = "0.1.0"
description = "Reproducible GraphRAG research project + scripts entrypoints + Streamlit demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0.0",
  "neo4j>=5.20.0",
  "openai>=1.30.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "tqdm>=4.66.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
